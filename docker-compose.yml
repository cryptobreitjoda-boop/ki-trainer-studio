version: '3.8'

services:
  ki-trainer:
    build: .
    container_name: ki-trainer-studio
    ports:
      - "8000:8000"   # API
      - "8888:8888"   # Jupyter
      - "6006:6006"   # TensorBoard
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000 --reload
    # Für GPU Support entkommentieren:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  jupyter:
    build: .
    container_name: ki-trainer-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
    depends_on:
      - ki-trainer

  tensorboard:
    build: .
    container_name: ki-trainer-tensorboard
    ports:
      - "6006:6006"
    volumes:
      - ./:/app
    command: tensorboard --logdir=/app/runs --host=0.0.0.0 --port=6006
    depends_on:
      - ki-trainer
