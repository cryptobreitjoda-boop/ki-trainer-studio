name: CI - Test & Build
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: |
        pip install -r requirements.txt
        pip install pytest
    - name: Test Training
      run: |
        mkdir -p models
        python -c "
        from ki_trainer import TrainerConfig, KiTrainer, DataManager
        c = TrainerConfig(epochs=2, batch_size=16)
        dm = DataManager(c)
        tl, vl = dm.load_demo('iris')
        t = KiTrainer(c)
        t.train(tl, vl, dm.input_dim, dm.output_dim)
        print('✅ Test OK')
        "
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: model-${{ matrix.python-version }}
        path: best_model.pt
        if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ki-trainer-studio:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  notebook:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - run: pip install -r requirements.txt jupyter nbconvert
    - run: jupyter nbconvert --to notebook --execute KI_Trainer_Notebook.ipynb --output /tmp/executed.ipynb --allow-errors